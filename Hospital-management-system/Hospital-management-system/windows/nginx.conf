# Copy this file to  C:\nginx\conf\nginx.conf  (replace the default one)
# Single entry point on port 80:
#   /            -> React build in C:/nginx/html/hospital
#   /api/...     -> Express backend on 127.0.0.1:4001
#   /health      -> Express backend on 127.0.0.1:4001

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    upstream hospital_backend {
        server 127.0.0.1:4001;
    }

    server {
        listen       80;
        server_name  _;

        root   C:/nginx/html/hospital;
        index  index.html;

        # ---------- Backend API ----------
        location /api/ {
            proxy_pass http://hospital_backend;      # keeps /api prefix
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location = /health {
            proxy_pass http://hospital_backend;
            proxy_set_header Host $host;
        }

        # ---------- Frontend (React static files) ----------
        location /assets/ {
            expires 7d;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;        # SPA fallback
        }
    }
}
